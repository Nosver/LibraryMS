<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind CSS Test</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <!-- Test Card -->
  <div class="max-w-sm rounded overflow-hidden shadow-lg bg-white">
    <img class="w-full" src="https://via.placeholder.com/600x300" alt="Placeholder Image">
    <div class="px-6 py-4">
      <h2 class="font-bold text-xl mb-2">Tailwind CSS Test</h2>
      <p class="text-gray-700 text-base">
        This is a simple test example to check Tailwind CSS is working properly without Node.js.
      </p>
    </div>
    <div class="px-6 pt-4 pb-2">
      <span class="inline-block bg-blue-200 text-blue-800 rounded-full px-3 py-1 text-sm font-semibold mr-2 mb-2">#Tailwind</span>
      <span class="inline-block bg-green-200 text-green-800 rounded-full px-3 py-1 text-sm font-semibold mr-2 mb-2">#CSS</span>
      <span class="inline-block bg-purple-200 text-purple-800 rounded-full px-3 py-1 text-sm font-semibold mr-2 mb-2">#Test</span>
    </div>
  </div>

</body>
</html>
